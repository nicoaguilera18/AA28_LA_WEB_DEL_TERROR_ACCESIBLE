<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Halloween</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="cabecera">
        <a href="index.html" class="logo">🎃 Halloween</a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="login.html">Iniciar sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Crear cuenta</h1>
        <form id="formRegistro" class="formulario">
            <label for="nombre">Usuario</label>
            <input type="text" id="nombre" minlength="3" maxlength="50" required>

            <label for="clave">Contraseña</label>
            <input type="password" id="clave" minlength="6" required>

            <label for="repetir">Repetir contraseña</label>
            <input type="password" id="repetir" minlength="6" required>

            <button type="submit" class="btn">Registrarme</button>
            <p id="mensaje" role="status"></p>
        </form>
        <p class="enlace-alterno">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
    </main>

    <footer class="pie">
        <p>&copy; 2026 - Universidad de la Cuenca del Plata - Paradigmas y Lenguajes de Programación III</p>
    </footer>

    <script src="js/registro.js"></script>
</body>
</html>
