<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Halloween</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="cabecera">
        <a href="index.html" class="logo">🎃 Halloween</a>
        <nav>
            <ul>
                <li><a href="index.html">Ver votación</a></li>
            </ul>
        </nav>
    </header>

    <main id="contenido" hidden>
        <h1>Panel de administración</h1>
        <p id="mensaje" role="status"></p>

        <div class="admin-panel">
            <form id="formDisfraz" class="formulario">
                <h2 id="tituloFormulario">Nuevo disfraz</h2>
                <input type="hidden" id="disfrazId">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" maxlength="50" required>

                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" rows="4" required></textarea>

                <label for="foto">Foto (JPG, PNG o WEBP, máx. 2 MB)</label>
                <input type="file" id="foto" accept="image/jpeg,image/png,image/webp">

                <button type="submit" class="btn">Guardar</button>
                <button type="button" class="btn btn-secundario" id="btnCancelar" hidden>Cancelar edición</button>
            </form>

            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Votos</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaDisfraces"></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="pie">
        <p>&copy; 2026 - Universidad de la Cuenca del Plata - Paradigmas y Lenguajes de Programación III</p>
    </footer>

    <script src="js/admin.js"></script>
</body>
</html>
